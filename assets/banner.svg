<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <!-- Scanning Line Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { transform: translateY(320px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.1; }
    }
    @keyframes ecgPulse {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .scanner-beam {
      animation: scanline 8s ease-in-out infinite;
    }
    .ecg-line {
      stroke-dasharray: 1200;
      animation: ecgPulse 6s linear infinite;
    }
    .pulsing-node {
      animation: pulseCircle 3s ease-in-out infinite;
      transform-origin: center;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="220" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="100" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Diagnostic Scanning Grid Overlay (Background) -->
  <g class="scanner-beam">
    <line x1="0" y1="20" x2="1200" y2="20" stroke="#00f2fe" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="20" fill="url(#cyan-glow)" opacity="0.05"/>
  </g>

  <!-- Dynamic ECG / Vital Signs Pulse Wave Across Lower Canvas -->
  <path class="ecg-line" d="M 0 310 L 150 310 L 170 310 L 180 295 L 195 330 L 210 270 L 225 340 L 235 310 L 400 310 L 420 310 L 430 295 L 445 335 L 460 265 L 475 345 L 485 310 L 680 310 L 700 310 L 710 295 L 725 330 L 740 270 L 755 340 L 765 310 L 950 310 L 970 310 L 980 295 L 995 335 L 1010 265 L 1025 345 L 1035 310 L 1200 310" 
        fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.5" filter="url(#glow)"/>

  <!-- Interactive Floating Diagnostic Tags / Badges in Dynamic Space -->
  <g class="pill-1" transform="translate(860, 50)">
    <rect width="185" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8" class="pulsing-node"/>
    <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing="0.5">X-Ray AI Triaging</text>
  </g>

  <g class="pill-2" transform="translate(980, 115)">
    <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
    <circle cx="20" cy="19" r="6" fill="#10b981" class="pulsing-node"/>
    <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing="0.5">Clinical PIMS &amp; CDS</text>
  </g>

  <g class="pill-3" transform="translate(890, 180)">
    <rect width="195" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9"/>
    <circle cx="20" cy="19" r="6" fill="#a855f7" class="pulsing-node"/>
    <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing="0.5">Pathology &amp; Cytology</text>
  </g>

  <!-- High-Tech Radar / Imaging Reticle Overlay -->
  <g transform="translate(1080, 75)" opacity="0.3">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Foreground Content: Uncompromised Visibility & Contrast -->
  <!-- Top Category Chip -->
  <g transform="translate(80, 52)">
    <rect width="270" height="28" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="14" y="19" fill="#60a5fa" font-size="11.5" font-weight="700" letter-spacing="1.2">🐾 CURATED VETERINARY AI &amp; HEALTH</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="132" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
    Automated Veterinary Diagnostics
  </text>
  <text x="80" y="178" fill="url(#purple-cyan)" font-size="34" font-weight="800" letter-spacing="-0.5" filter="url(#subtle-glow)">
    Assistance Ecosystem 🩺⚡
  </text>

  <!-- Subtitle -->
  <text x="80" y="224" fill="#94a3b8" font-size="15.5" font-weight="400" letter-spacing="0.2">
    State-of-the-art SaaS platforms, clinical intelligence tools &amp; open-source AI models
  </text>
  <text x="80" y="248" fill="#64748b" font-size="14" font-weight="400">
    Powering animal health imaging, automated pathology, canine/feline disease triage &amp; modern PIMS
  </text>

  <!-- Bottom Spec Pills (Static for crisp foreground readability) -->
  <g transform="translate(80, 276)">
    <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="17" fill="#cbd5e1" font-size="11" font-weight="600">📊 SaaS Pricing</text>

    <rect x="140" width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="152" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🔬 Open Models</text>

    <rect x="295" width="155" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="307" y="17" fill="#cbd5e1" font-size="11" font-weight="600">⭐ Star Rankings</text>

    <rect x="460" width="170" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="472" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🌐 Market Dynamics</text>
  </g>
</svg>
