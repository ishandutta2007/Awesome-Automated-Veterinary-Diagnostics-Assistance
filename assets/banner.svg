<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#0a192f"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".9"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".9"/></linearGradient><linearGradient id="emerald-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="purple-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 30 0 L 0 0 0 30"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtle-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="1.5"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes scanline{0%{transform:translateY(0);opacity:.1}50%{transform:translateY(320px);opacity:.8}}@keyframes ecgPulse{0%{stroke-dashoffset:1200}}@keyframes pulseCircle{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.85}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPillReverse{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes radarSpin{0%{transform:rotate(0deg)}}.scanner-beam{animation:scanline 8s ease-in-out infinite}.ecg-line{stroke-dasharray:1200;animation:ecgPulse 6s linear infinite}.pulsing-node{animation:pulseCircle 3s ease-in-out infinite;transform-origin:center}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPillReverse 6s ease-in-out infinite}.pill-3{animation:floatPill 5.5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="150" cy="80" r="180" fill="#0284c7" filter="url(#glow)" opacity=".12"/><circle cx="1050" cy="280" r="220" fill="#6366f1" filter="url(#glow)" opacity=".12"/><circle cx="950" cy="100" r="140" fill="#10b981" filter="url(#glow)" opacity=".08"/><g class="scanner-beam"><line x1="0" x2="1200" y1="20" y2="20" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" opacity=".6"/><rect width="1200" height="20" x="0" y="0" fill="url(#cyan-glow)" opacity=".05"/></g><path fill="none" stroke="#00f2fe" stroke-width="2.5" d="M 0 310 L 150 310 L 170 310 L 180 295 L 195 330 L 210 270 L 225 340 L 235 310 L 400 310 L 420 310 L 430 295 L 445 335 L 460 265 L 475 345 L 485 310 L 680 310 L 700 310 L 710 295 L 725 330 L 740 270 L 755 340 L 765 310 L 950 310 L 970 310 L 980 295 L 995 335 L 1010 265 L 1025 345 L 1035 310 L 1200 310" class="ecg-line" filter="url(#glow)" opacity=".5"/><g class="pill-1" transform="translate(860, 50)"><rect width="185" height="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#38bdf8" class="pulsing-node"/><text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing=".5">X-Ray AI Triaging</text></g><g class="pill-2" transform="translate(980, 115)"><rect width="180" height="38" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#10b981" class="pulsing-node"/><text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing=".5">Clinical PIMS &amp; CDS</text></g><g class="pill-3" transform="translate(890, 180)"><rect width="195" height="38" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#a855f7" class="pulsing-node"/><text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600" letter-spacing=".5">Pathology &amp; Cytology</text></g><g opacity=".3" transform="translate(1080, 75)"><circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1"/><circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="1"/><line x1="-50" x2="50" y1="0" y2="0" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="0" y1="-50" y2="50" stroke="#38bdf8" stroke-width="1"/></g><g transform="translate(80, 52)"><rect width="270" height="28" fill="#172554" stroke="#3b82f6" stroke-width="1" rx="14"/><text x="14" y="19" fill="#60a5fa" font-size="11.5" font-weight="700" letter-spacing="1.2">🐾 CURATED VETERINARY AI &amp; HEALTH</text></g><text x="80" y="132" fill="#fff" font-size="38" font-weight="800" letter-spacing="-.5">Automated Veterinary Diagnostics</text><text x="80" y="178" fill="url(#purple-cyan)" filter="url(#subtle-glow)" font-size="34" font-weight="800" letter-spacing="-.5">Assistance Ecosystem 🩺⚡</text><text x="80" y="224" fill="#94a3b8" font-size="15.5" font-weight="400" letter-spacing=".2">State-of-the-art SaaS platforms, clinical intelligence tools &amp; open-source AI models</text><text x="80" y="248" fill="#64748b" font-size="14" font-weight="400">Powering animal health imaging, automated pathology, canine/feline disease triage &amp; modern PIMS</text><g transform="translate(80, 276)"><rect width="130" height="26" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/><text x="12" y="17" fill="#cbd5e1" font-size="11" font-weight="600">📊 SaaS Pricing</text><rect width="145" height="26" x="140" fill="#0f172a" stroke="#334155" stroke-width="1"